services:
  vsp-mysql:
    image: mysql:9
    command: --log_bin_trust_function_creators=1
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vsp
      MYSQL_USER: vsp
      MYSQL_PASSWORD: vsppassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  vsp-backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://vsp-mysql:3306/vsp
      MINIO_ENDPOINT: http://vsp-storage:9000
    depends_on:
      vsp-mysql:
        condition: service_healthy
      vsp-storage:
        condition: service_healthy
    restart: unless-stopped

  vsp-storage:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: vspadmin
      RUSTFS_SECRET_KEY: vspminioadmin
      RUSTFS_VOLUMES: /data
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  vsp-storage-setup:
    image: amazon/aws-cli:latest
    depends_on:
      vsp-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: vspadmin
      AWS_SECRET_ACCESS_KEY: vspminioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    entrypoint: /bin/sh
    command: >
      -c "aws --endpoint-url http://vsp-storage:9000 s3api create-bucket --bucket vsp-media 2>/dev/null;
      aws --endpoint-url http://vsp-storage:9000 s3api put-bucket-policy --bucket vsp-media
      --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::vsp-media/*\"]}]}';
      aws --endpoint-url http://vsp-storage:9000 s3api head-bucket --bucket vsp-media"

volumes:
  mysql-data:
    name: vsp_mysql-data
  storage-data:
    name: vsp_storage-data
