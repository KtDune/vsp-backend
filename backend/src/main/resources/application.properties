spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3307/vsp
spring.datasource.username=vsp
spring.datasource.password=vsppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2100MB

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:vspadmin}
minio.secret-key=${MINIO_SECRET_KEY:vspminioadmin}
minio.bucket=${MINIO_BUCKET:vsp-media}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000/vsp-media}

jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:false}
